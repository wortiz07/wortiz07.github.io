<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería de GIFs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Galería de GIFs</h1>
    </header>

    <main class="galeria">
        {% for archivo in site.static_files %}
            {% if archivo.path contains '/gifs/' %}
                <div class="item-gif">
                    <img src="{{ archivo.path | remove_first: '/' }}" alt="GIF animado">
                </div>
            {% endif %}
        {% endfor %}
    </main>

    <div id="paginacion" class="paginacion"></div>

    <script src="script.js"></script>
</body>
</html>
