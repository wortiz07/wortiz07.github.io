<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería de GIFs</title>
    <link rel="stylesheet" href="style.css?v={{ site.time | date: '%s' }}">
</head>
<body>

    <header>
        <h1>Galería de GIFs</h1>
    </header>

    <main class="galeria">
        {% for archivo in site.static_files %}
            {% if archivo.path contains '/gifs/' %}
                <div class="item-gif">
                    <div class="img-wrapper">
                        <img src="{{ archivo.path | remove_first: '/' }}?v={{ site.time | date: '%s' }}" alt="GIF animado">
                    </div>
                    <a href="{{ archivo.path | remove_first: '/' }}" download class="btn-descarga">
                        Descargar
                    </a>
                </div>
            {% endif %}
        {% endfor %}
    </main>

    <div id="paginacion" class="paginacion"></div>

    <script src="script.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
