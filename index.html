<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Visual | William Ortiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Portafolio de GIFs</h1>
        <p>Galería de animaciones, ediciones y proyectos visuales.</p>
    </header>

    <main class="gallery">
        <div class="gif-item">
            <img src="gifs/proyecto1.gif" alt="Edición visual 1">
            <div class="descripcion">
                <h3>Transformación de objeto</h3>
            </div>
        </div>

        <div class="gif-item">
            <img src="gifs/proyecto2.gif" alt="Edición visual 2">
            <div class="descripcion">
                <h3>Cambio de fondo</h3>
            </div>
        </div>

        </main>
</body>
</html>
